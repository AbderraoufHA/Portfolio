name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Types, lint, format, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm run test

      # Build once with a project-page base path. This is the failure mode that
      # only shows up after deploy: a hard-coded /assets path that ignores BASE_PATH.
      - name: Build with a base path
        run: npm run build
        env:
          SITE_URL: https://example.github.io
          BASE_PATH: /portfolio

      - name: Upload build for browser tests
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  browser:
    name: E2E + Lighthouse
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # The artifact was built with BASE_PATH=/portfolio, so rebuild at root for
      # tests that assume `/`. This also proves the config is base-agnostic.
      - name: Build at root
        run: npm run build
        env:
          SITE_URL: https://example.github.io
          BASE_PATH: ''

      - name: E2E smoke tests
        run: npm run test:e2e

      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
