<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Canary rollout simulator</title>
    <style>
      :root { --bg:#080b0f; --panel:#0f141b; --line:#1e2731; --ink:#e2ebf3; --muted:#8b98a6; --accent:#a78bfa; --ok:#86efac; --bad:#fca5a5; color-scheme: dark; }
      * { box-sizing:border-box; }
      body { margin:0; background: radial-gradient(900px 400px at 15% 0%, #a78bfa22, transparent 60%), var(--bg); color:var(--ink); font:13px/1.55 ui-monospace, Menlo, monospace; min-height:100vh; }
      header { padding:16px 20px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
      h1 { font-size:13px; margin:0; }
      .tag { margin-left:auto; font-size:11px; color:var(--muted); border:1px solid var(--line); padding:3px 9px; border-radius:99px; }
      main { max-width: 1000px; margin:0 auto; padding:20px; display:grid; grid-template-columns: 1.1fr 1fr; gap:16px; }
      .panel { border:1px solid var(--line); border-radius:12px; background:var(--panel); padding:16px; }
      .panel h2 { font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin:0 0 12px; }
      .steps { display:grid; gap:8px; margin:0; padding:0; list-style:none; }
      .steps li { display:flex; align-items:center; gap:10px; padding:9px 12px; border:1px solid var(--line); border-radius:9px; background:#0b1117; color:var(--muted); }
      .steps li.active { border-color:var(--accent); color:var(--ink); box-shadow:0 0 0 1px #a78bfa55, 0 12px 40px -20px #a78bfa; }
      .steps li.done { color:var(--ok); border-color:#14532d55; }
      .steps li.failed { color:var(--bad); border-color:#7f1d1d; }
      .pct { margin-left:auto; font-variant-numeric: tabular-nums; }
      .bar { height:10px; background:#0b1117; border:1px solid var(--line); border-radius:99px; overflow:hidden; margin-top:12px; }
      .bar > div { height:100%; width:0%; background:linear-gradient(90deg,#7c3aed,var(--accent)); transition: width .4s ease; }
      .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }
      button { font:inherit; color:var(--ink); background:#121a22; border:1px solid var(--line); border-radius:8px; padding:7px 12px; cursor:pointer; }
      button:hover { border-color:var(--accent); }
      button:disabled { opacity:.45; cursor:not-allowed; }
      button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
      pre { margin:0; font:inherit; font-size:12px; white-space:pre-wrap; color:var(--muted); min-height:220px; }
      .ok { color:var(--ok); } .bad { color:var(--bad); } .hl { color:var(--accent); }
      @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
      @media (prefers-reduced-motion: reduce) { .bar > div { transition:none; } }
    </style>
  </head>
  <body>
    <header><h1>rollout operator — simulator</h1><span class="tag">state machine · no cluster required</span></header>
    <main>
      <section class="panel">
        <h2>progress</h2>
        <ol class="steps" id="steps">
          <li data-step="0"><span>1 · setWeight</span><span class="pct">5%</span></li>
          <li data-step="1"><span>2 · analysis</span><span class="pct">2m</span></li>
          <li data-step="2"><span>3 · setWeight</span><span class="pct">50%</span></li>
          <li data-step="3"><span>4 · analysis</span><span class="pct">5m</span></li>
          <li data-step="4"><span>5 · setWeight</span><span class="pct">100%</span></li>
        </ol>
        <div class="bar"><div id="progress"></div></div>
        <div class="row">
          <button id="promote">Promote one step</button>
          <button id="fail">Inject failure</button>
          <button id="reset">Reset</button>
        </div>
      </section>
      <section class="panel">
        <h2>operator log</h2>
        <pre id="log">$ rollout get api
ready — 5 steps ahead.</pre>
      </section>
    </main>
    <script>
      const steps = document.getElementById('steps');
      const log = document.getElementById('log');
      const progress = document.getElementById('progress');
      const promote = document.getElementById('promote');
      const fail = document.getElementById('fail');
      let index = -1;
      let failed = false;

      const money = ['5%', '25%', '50%', '75%', '100%'];

      function render() {
        [...steps.children].forEach((li, i) => {
          li.className = i < index ? 'done' : i === index ? 'active' : '';
          if (failed && i === index) li.classList.add('failed');
        });
        progress.style.width = Math.max(0, ((index + 1) / steps.children.length) * 100) + '%';
        promote.disabled = failed || index >= steps.children.length - 1;
        for (const li of steps.children) {
          const i = Number(li.dataset.step);
          li.querySelector('.pct').textContent = i === 0 || i === 2 || i === 4 ? (i === 0 ? '5%' : i === 2 ? '50%' : '100%') : i === 1 ? '2m' : '5m';
        }
      }

      function write(line, cls = '') {
        const span = document.createElement('span');
        if (cls) span.className = cls;
        span.textContent = line + '\n';
        log.appendChild(span);
        log.scrollTop = log.scrollHeight;
      }

      promote.addEventListener('click', () => {
        index += 1;
        write('$ reconcile step ' + (index + 1) + '…', 'hl');
        if (index % 2 === 0) {
          write('✔ setWeight ' + money[Math.min(index, money.length - 1)] + ' — 42 pods ready');
        } else {
          write('→ query prometheus: error_rate=0.02% p95=+3ms');
          write('✔ analysis passed');
        }
        render();
      });

      fail.addEventListener('click', () => {
        if (index < 0) index = 0;
        failed = true;
        write('✖ analysis failed: error budget exhausted (remaining 4%)', 'bad');
        write('→ rollback stable ReplicaSet · traffic 0% → stable');
        write('✔ rollback complete in 38s', 'ok');
        render();
      });

      document.getElementById('reset').addEventListener('click', () => {
        index = -1; failed = false;
        log.textContent = '$ rollout get api\nready — 5 steps ahead.\n';
        render();
      });

      render();
    </script>
  </body>
</html>
