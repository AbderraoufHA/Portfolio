<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LedgerLite — sandbox</title>
    <style>
      :root { --bg:#080b0f; --panel:#0f141b; --line:#1e2731; --ink:#e2ebf3; --muted:#8b98a6; --accent:#fbbf24; --ok:#86efac; color-scheme: dark; }
      * { box-sizing: border-box; }
      body { margin:0; min-height:100vh; background: radial-gradient(800px 380px at 100% 100%, #fbbf2422, transparent 60%), var(--bg); color:var(--ink); font:13px/1.55 ui-monospace, Menlo, monospace; }
      header { padding:14px 20px; border-bottom:1px solid var(--line); display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
      h1 { margin:0; font-size:13px; }
      .tag { margin-left:auto; font-size:11px; color:var(--muted); border:1px solid var(--line); border-radius:99px; padding:3px 9px; }
      main { max-width:980px; margin:0 auto; padding:18px; display:grid; gap:14px; }
      .panel { border:1px solid var(--line); border-radius:12px; background:var(--panel); padding:16px; }
      .panel h2 { font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin:0 0 12px; }
      form { display:grid; grid-template-columns: 1.4fr 1fr .9fr .9fr auto; gap:8px; align-items:end; }
      label { display:grid; gap:4px; font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
      input, select, button { font:inherit; color:var(--ink); background:#101820; border:1px solid var(--line); border-radius:8px; padding:7px 9px; width:100%; }
      button { cursor:pointer; width:auto; white-space:nowrap; }
      button:hover { border-color:var(--accent); }
      button:focus-visible, input:focus-visible, select:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
      table { width:100%; border-collapse:collapse; font-size:12.5px; }
      th { text-align:left; color:var(--muted); font-weight:500; font-size:10px; letter-spacing:.1em; text-transform:uppercase; padding:8px; border-bottom:1px solid var(--line); }
      td { padding:8px; border-bottom:1px solid #16202a; font-variant-numeric: tabular-nums; }
      td.num, th.num { text-align:right; }
      .ok { color:var(--ok); } .accent { color:var(--accent); }
      .empty { color:var(--muted); padding:18px 0; }
      .msg { margin-top:10px; font-size:11.5px; color:var(--muted); min-height:1.2em; }
      @media (max-width: 760px) { form { grid-template-columns: 1fr 1fr; } }
    </style>
  </head>
  <body>
    <header><h1>ledger-lite — sandbox</h1><span class="tag">data stays in this frame</span></header>
    <main>
      <section class="panel">
        <h2>new entry</h2>
        <form id="form" novalidate>
          <label>account
            <select id="account">
              <option value="cash">Cash</option>
              <option value="revenue">Revenue</option>
              <option value="infra">Cloud infra</option>
              <option value="vat">VAT payable</option>
            </select>
          </label>
          <label>type
            <select id="kind">
              <option value="debit">Debit</option>
              <option value="credit">Credit</option>
            </select>
          </label>
          <label>amount
            <input id="amount" inputmode="decimal" placeholder="120.00" autocomplete="off" />
          </label>
          <label>currency
            <select id="currency"><option>EUR</option><option>USD</option><option>GBP</option></select>
          </label>
          <button type="submit">Post entry</button>
        </form>
        <div class="msg" id="msg" role="status" aria-live="polite">Amounts are integers in minor units — no floats.</div>
      </section>

      <section class="panel">
        <h2>entries</h2>
        <table>
          <thead><tr><th>account</th><th>type</th><th class="num">debit</th><th class="num">credit</th><th>when</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
        <div class="empty" id="empty" hidden>No entries yet. Post one above.</div>
      </section>

      <section class="panel">
        <h2>derived balances</h2>
        <table>
          <thead><tr><th>account</th><th class="num">balance</th></tr></thead>
          <tbody id="balances"></tbody>
        </table>
        <div class="msg" id="perf"></div>
      </section>
    </main>
    <script>
      const money = new Intl.NumberFormat('en-IE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      let entries = [
        { account: 'cash', type: 'debit', amount: 1240000, currency: 'EUR', at: Date.now() - 86400000 },
        { account: 'revenue', type: 'credit', amount: 1240000, currency: 'EUR', at: Date.now() - 86400000 },
        { account: 'infra', type: 'debit', amount: 118000, currency: 'EUR', at: Date.now() - 3600000 },
        { account: 'cash', type: 'credit', amount: 118000, currency: 'EUR', at: Date.now() - 3600000 }
      ];

      const labels = { cash: 'Cash', revenue: 'Revenue', infra: 'Cloud infra', vat: 'VAT payable' };
      const rows = document.getElementById('rows');
      const balances = document.getElementById('balances');
      const empty = document.getElementById('empty');
      const msg = document.getElementById('msg');
      const perf = document.getElementById('perf');

      function render() {
        rows.innerHTML = '';
        for (const entry of [...entries].reverse()) {
          const tr = document.createElement('tr');
          tr.innerHTML =
            '<td>' + labels[entry.account] + '</td>' +
            '<td>' + entry.type + '</td>' +
            '<td class="num">' + (entry.type === 'debit' ? money.format(entry.amount / 100) + ' ' + entry.currency : '') + '</td>' +
            '<td class="num">' + (entry.type === 'credit' ? money.format(entry.amount / 100) + ' ' + entry.currency : '') + '</td>' +
            '<td>' + new Date(entry.at).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }) + '</td>';
          rows.appendChild(tr);
        }
        empty.hidden = entries.length > 0;

        const t0 = performance.now();
        const totals = new Map();
        for (const entry of entries) {
          const delta = (entry.type === 'debit' ? entry.amount : -entry.amount);
          totals.set(entry.account, (totals.get(entry.account) ?? 0) + delta);
        }
        const elapsed = performance.now() - t0;
        balances.innerHTML = '';
        for (const [account, total] of totals) {
          const tr = document.createElement('tr');
          tr.innerHTML = '<td>' + labels[account] + '</td><td class="num ' + (total >= 0 ? 'ok' : 'accent') + '">' + money.format(total / 100) + ' EUR</td>';
          balances.appendChild(tr);
        }
        perf.textContent = 'derived ' + entries.length + ' entries in ' + elapsed.toFixed(3) + ' ms (no stored balances)';
      }

      document.getElementById('form').addEventListener('submit', (event) => {
        event.preventDefault();
        const raw = document.getElementById('amount').value.trim().replace(',', '.');
        const value = Number.parseFloat(raw);
        if (!Number.isFinite(value) || value <= 0) {
          msg.textContent = 'Enter a positive amount, e.g. 120.50';
          msg.className = 'msg accent';
          document.getElementById('amount').focus();
          return;
        }
        const amount = Math.round(value * 100);
        entries.push({
          account: document.getElementById('account').value,
          type: document.getElementById('kind').value,
          amount,
          currency: document.getElementById('currency').value,
          at: Date.now()
        });
        msg.textContent = 'posted ' + money.format(amount / 100) + ' — balance derived, nothing stored';
        msg.className = 'msg ok';
        document.getElementById('amount').value = '';
        render();
      });

      render();
    </script>
  </body>
</html>
