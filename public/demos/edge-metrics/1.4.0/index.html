<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EdgeMetrics 1.4.0 — static snapshot</title>
    <style>
      :root {
        --bg: #080b0f;
        --panel: #0f141b;
        --line: #1e2731;
        --ink: #e2ebf3;
        --muted: #8b98a6;
        --accent: #5eead4;
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(1200px 500px at 85% -10%, color-mix(in oklab, var(--accent) 18%, transparent), transparent 60%),
          var(--bg);
        color: var(--ink);
        font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      header {
        display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
        padding: 16px 20px; border-bottom: 1px solid var(--line); background: #0b1016cc;
      }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--accent); }
      h1 { font-size: 14px; margin: 0; font-weight: 600; letter-spacing: 0.02em; }
      .badge {
        margin-left: auto; font-size: 11px; border: 1px solid var(--line); border-radius: 999px;
        padding: 4px 10px; color: var(--muted);
      }
      main { padding: 20px; display: grid; gap: 16px; grid-template-columns: 2fr 1fr; max-width: 1100px; margin: 0 auto; }
      .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
      .card h2 { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; }
      canvas { width: 100%; height: 260px; display: block; }
      .stats { display: grid; gap: 12px; }
      .stat { border: 1px solid var(--line); border-radius: 12px; padding: 14px; background: #0c1218; }
      .stat b { display: block; font-size: 26px; font-family: ui-sans-serif, system-ui, sans-serif; letter-spacing: -0.02em; }
      .stat span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; }
      .ok { color: var(--accent); }
      footer { padding: 12px 20px 28px; color: var(--muted); font-size: 11px; text-align: center; }
      button {
        font: inherit; font-size: 12px; color: var(--ink); background: #121a22; border: 1px solid var(--line);
        border-radius: 8px; padding: 6px 12px; cursor: pointer;
      }
      button:hover { border-color: var(--accent); }
      button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      .row { display: flex; gap: 8px; align-items: center; margin-top: 12px; color: var(--muted); }
      @media (max-width: 760px) { main { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <header>
      <span class="dot" aria-hidden="true"></span>
      <h1>edge-metrics — live</h1>
      <span class="badge">static snapshot · recorded data</span>
    </header>
    <main>
      <section class="card" aria-labelledby="chart-title">
        <h2 id="chart-title">ingest latency · last 15 min</h2>
        <canvas id="chart" role="img" aria-label="Latency sparkline, p95 currently around 42 milliseconds"></canvas>
        <div class="row">
          <button id="toggle" aria-pressed="false">Pause stream</button>
          <span id="hint">updating every 700 ms</span>
        </div>
      </section>
      <aside class="stats" aria-label="Key metrics">
        <div class="stat"><span>p95</span><b class="ok" id="p95">42 ms</b></div>
        <div class="stat"><span>requests / s</span><b id="rps">128 402</b></div>
        <div class="stat"><span>uptime</span><b>99.98%</b></div>
        <div class="stat"><span>regions</span><b class="ok">17 / 17</b></div>
      </aside>
    </main>
    <footer>this is a static build — no network requests leave your browser</footer>
    <script>
      const canvas = document.getElementById('chart');
      const ctx = canvas.getContext('2d');
      const points = Array.from({ length: 90 }, () => 0.45 + Math.random() * 0.25);
      let paused = false;
      let raf = 0;

      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const rect = canvas.getBoundingClientRect();
        canvas.width = Math.round(rect.width * dpr);
        canvas.height = Math.round(rect.height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        draw();
      }

      function draw() {
        const w = canvas.width / (Math.min(window.devicePixelRatio || 1, 2));
        const h = canvas.height / (Math.min(window.devicePixelRatio || 1, 2));
        ctx.clearRect(0, 0, w, h);
        ctx.strokeStyle = 'rgba(255,255,255,.05)';
        ctx.lineWidth = 1;
        for (let i = 1; i < 5; i++) {
          ctx.beginPath();
          ctx.moveTo(0, (h / 5) * i);
          ctx.lineTo(w, (h / 5) * i);
          ctx.stroke();
        }
        const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#5eead4';
        const grad = ctx.createLinearGradient(0, 0, 0, h);
        grad.addColorStop(0, 'rgba(94,234,212,.35)');
        grad.addColorStop(1, 'rgba(94,234,212,0)');
        ctx.beginPath();
        points.forEach((v, i) => {
          const x = (i / (points.length - 1)) * w;
          const y = h - v * h;
          i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        });
        ctx.lineTo(w, h);
        ctx.lineTo(0, h);
        ctx.closePath();
        ctx.fillStyle = grad;
        ctx.fill();
        ctx.beginPath();
        points.forEach((v, i) => {
          const x = (i / (points.length - 1)) * w;
          const y = h - v * h;
          i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        });
        ctx.strokeStyle = accent;
        ctx.lineWidth = 2;
        ctx.lineJoin = 'round';
        ctx.stroke();
        const last = points[points.length - 1];
        ctx.beginPath();
        ctx.arc(w - 1, h - last * h, 4, 0, Math.PI * 2);
        ctx.fillStyle = accent;
        ctx.fill();
      }

      function tick() {
        if (!paused) {
          points.shift();
          const last = points[points.length - 1];
          points.push(Math.max(0.12, Math.min(0.95, last + (Math.random() - 0.5) * 0.18)));
          const p95 = Math.round(18 + (1 - points[points.length - 1]) * 60);
          document.getElementById('p95').textContent = p95 + ' ms';
          document.getElementById('rps').textContent = (120000 + Math.round(Math.random() * 12000)).toLocaleString('en-US').replace(/,/g, ' ');
          draw();
        }
        raf = requestAnimationFrame(tick);
      }

      const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      document.getElementById('toggle').addEventListener('click', (event) => {
        paused = !paused;
        event.currentTarget.textContent = paused ? 'Resume stream' : 'Pause stream';
        event.currentTarget.setAttribute('aria-pressed', String(paused));
        document.getElementById('hint').textContent = paused ? 'paused' : 'updating every 700 ms';
      });
      window.addEventListener('resize', resize);
      resize();
      if (!reduce) {
        let last = 0;
        const loop = (t) => {
          if (t - last > 700) { tick(); last = t; }
          raf = requestAnimationFrame(loop);
        };
        raf = requestAnimationFrame(loop);
      }
      window.addEventListener('pagehide', () => cancelAnimationFrame(raf));
    </script>
  </body>
</html>
